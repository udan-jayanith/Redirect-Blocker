<!--- Styles by https://github.com/Cristofer543 -->
<html>
	<link
		rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
	/>

	<link rel="stylesheet" href="popupStyles.css" />
	<link rel="stylesheet" href="new-ui.css" />

	<body>
		<header class="header">
			<h1 class="extension-name">
				<img
					class="logo"
					src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='1.5' stroke='currentColor'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' d='M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z' /%3E%3C/svg%3E"
				/>
				<div class="name">Redirect Blocker</div>
			</h1>
			<div class="links">
				<a
					aria-label="Github Page"
					target="_blank"
					href="https://github.com/Tyson3101/Redirect-Blocker"
					class="github-corner"
				>
					<i class="fa fa-github logo"></i
				></a>
				<a aria-label="Github Page" target="_blank" href="/dist/popup/help.html" class="help-corner">
					<i class="fa fa-question-circle logo" aria-hidden="true"></i
				></a>
			</div>
		</header>

		<nav class="main-tab">
			<div class="home-tab tab selected">Home</div>
			<div class="settings-tab tab">Settings</div>
		</nav>

		<main>
			<template class="home-tab-template">
				<div class="toggleContainer">
					<nav class="extensionModes">
						<div href="#" class="currentTabExtMode selected tab">Current Tab</div>
						<div href="#" class="allTabsExtMode tab">All Tabs</div>
					</nav>

					<div class="toggle-btn-container">
						<span class="desc"
							><i style="font-size: 3.9vw">
								<br />Stops Potential Malcious/Annoying Redirects<br /></i
						></span>
						<button class="toggleBtn">Start</button>
						<i id="error" style="color: red"></i>
					</div>

					<div class="shortCut">
						<h2>Shortcuts</h2>
						<p>
							<span class="titleShortCut">Toggle Active Tab:</span>
							<span id="shortCutSingleDisplay">alt + shift + s</span>
						</p>
						<p>
							<span class="titleShortCut">Toggle All Tabs:</span>
							<span id="shortCutAllDisplay">alt + shift + a</span>
						</p>
					</div>
				</div>
			</template>

			<template class="settings-tab-template">
				<div class="settings">
					<div data-settingIndex="0" class="settingsPage list active">
						<div id="savedURLsPage">
							<label
								><p style="font-size: 1rem">
									Saved URLS
									<i style="font-size: 0.69em; display: block"
										>Automatically activate on a saved URL (one URL per line)</i
									>
								</p></label
							>
							<textarea id="savedURLs" class="urlsList"></textarea>
							<p><a href="#" id="changeToAllowedURLPage">Show Allowed URLs</a></p>
						</div>
						<div id="allowedURLsPage" class="remove">
							<label
								><p style="font-size: 1rem">
									Allowed URLS
									<i style="font-size: 0.7em; display: block"
										>Allow redirects to these URLS (one URL per line)</i
									>
								</p></label
							>
							<textarea id="allowedURLS" class="urlsList"></textarea>
							<p><a href="#" id="changeToSavedURLPage">Show Saved URLs</a></p>
						</div>
					</div>
					<hr />
					<div data-settingIndex="1" class="settingsPage">
						<label
							><p style="font-size: 1rem">
								Tab exclusive or URL exclusive
								<i style="font-size: 0.7em; display: block"
									>Auto turn off when tab deleted OR when the URL hostname changes
								</i>
							</p></label
						>
						<select name="turnOffOnWhen" id="turnOffOnWhen">
							<option value="tab">Tab</option>
							<option value="url">URL</option>
						</select>
						<i>Only applies for single toggled tabs</i>
					</div>
					<hr />
					<div data-settingIndex="2" class="settingsPage">
						<label
							><p style="font-size: 1rem">
								Shortcut
								<i style="font-size: 0.7em; display: block"
									>Customize the key(s) to toggle the extension on/off. (Seperate with
									<span
										style="
											background-color: rgb(220, 209, 209);
											font-weight: bold;
											font-size: larger;
										"
										>+</span
									>)</i
								>
							</p></label
						>
						<div class="shortCutSettings">
							<span class="shortCutSingleContainer" style="display: block"
								>Current Tab:
								<input
									type="text"
									name="shortCutSingleInput"
									id="shortCutSingleInput"
									value="alt + shift + s"
									style="width: 40%"
							/></span>
							<span class="shortCutAllContainer" style="display: block"
								>All Tabs:
								<input
									type="text"
									name="shortCutAllInput"
									id="shortCutAllInput"
									value="alt + shift + a"
									style="width: 40%"
							/></span>
						</div>
						<p>
							See
							<a
								href="https://developer.mozilla.org/en-US/docs/Web/API/UI_Events/Keyboard_event_key_values"
								target="_blank"
								>this link</a
							>
							to match the key(s) you want to use.
						</p>
					</div>
					<hr />
					<div data-settingIndex="3" class="settingsPage">
						<label
							><p style="font-size: 1rem">
								Startup Options
								<i style="font-size: 0.7em; display: block"
									>Allows the extension to be toggled on for all tabs from when Chrome
									starts up.<br />
								</i></p
						></label>

						<select name="startupOptions" id="onStartup">
							<option value="false">Off</option>
							<option value="true">On</option>
						</select>

						<p>May not work if chrome is runs in background</p>
					</div>
					<hr />
					<div data-settingIndex="4" class="settingsPage">
						<label
							><p style="font-size: 1rem">
								Prevent Redirects on Same Tab
								<i style="font-size: 0.7em; display: block"
									>Disables links taking you to a different site <br />(On the Same Tab)</i
								>
							</p></label
						>
						<select name="preventSameTabRedirects" id="preventSameTabRedirects">
							<option value="true">Prevent</option>
							<option value="false">Allow</option>
						</select>
					</div>
				</div>
			</template>
			<div class="visible-main-content"></div>
		</main>

		<p id="footerRedirectNote">
			If redirect needed, just toogle off then back on,<br />Or go to a tab/url without the extension
			activated.
		</p>
		<footer id="adChrome">
			Do you enjoy this extension? Make sure to give it 5 stars on the
			<a
				href="https://chrome.google.com/webstore/detail/redirect-blocker/egmgebeelgaakhaoodlmnimbfemfgdah"
				target="_blank"
				>Chrome Web Store!</a
			>
		</footer>
		<script src="../new-scripts.js"></script>
		<!--<script src="../script.js"></script>-->
	</body>
</html>
